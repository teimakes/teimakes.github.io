<svg xmlns="http://www.w3.org/2000/svg" width="620" height="650" viewBox="0 0 620 650" role="img" aria-labelledby="title desc">
<title id="title">Decoder language model and attention block</title><desc id="desc">Tokens become embeddings, pass through repeated pre-norm attention and feed-forward blocks with residual connections, then produce next-token logits.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#625b52"/></marker></defs>
<rect width="620" height="650" rx="14" fill="#fbf6ed"/>
<g font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#1b1915">
<text x="310" y="30" font-weight="700">Decoder LM: from tokens to next-token logits</text>
<g stroke="#a83f12" stroke-width="1.5" fill="#fffaf1">
<rect x="140" y="52" width="340" height="42" rx="8"/>
<rect x="140" y="116" width="340" height="48" rx="8"/>
<rect x="115" y="185" width="390" height="318" rx="12" stroke-dasharray="6 4"/>
<rect x="180" y="220" width="260" height="45" rx="8"/>
<rect x="180" y="287" width="260" height="48" rx="8" fill="#f8d8c5"/>
<rect x="180" y="357" width="260" height="45" rx="8"/>
<rect x="180" y="425" width="260" height="45" rx="8"/>
<rect x="140" y="527" width="340" height="45" rx="8"/>
<rect x="140" y="596" width="340" height="40" rx="8"/>
</g>
<text x="310" y="79">Token IDs</text><text x="310" y="146">Token + position embeddings</text>
<text x="310" y="209" font-size="13">Repeat blocks (week 5: two blocks)</text>
<text x="310" y="249">LayerNorm</text><text x="310" y="308">Causal multi-head attention</text><text x="310" y="326" font-size="12">QK scores → softmax → weighted V</text>
<text x="310" y="385">LayerNorm</text><text x="310" y="452">FFN: Linear → GELU → Linear</text>
<text x="310" y="555">Final LayerNorm + vocabulary head</text><text x="310" y="622">Next-token logits → probabilities</text>
<g stroke="#625b52" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M310 94V116"/><path d="M310 164V220"/><path d="M310 265V287"/><path d="M310 335V357"/><path d="M310 402V425"/><path d="M310 470V527"/><path d="M310 572V596"/>
<path d="M180 234H85V346H294"/><path d="M180 370H65V487H294"/>
</g>
<text x="310" y="352" font-size="22">+</text><text x="310" y="494" font-size="22">+</text>
<text x="75" y="296" transform="rotate(-90 75 296)" font-size="12">residual</text><text x="55" y="433" transform="rotate(-90 55 433)" font-size="12">residual</text>
</g></svg>
